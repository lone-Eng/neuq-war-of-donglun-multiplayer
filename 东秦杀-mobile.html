 * 所有真人都选完之后调用：把没选走的候选并回池子，电脑再从剩下的里挑，
 * 最后做一次"绝不允许两个座位拿到同一个角色"的兜底校验。
 * 不负责 finalizeGame() / 发手牌 —— 那是调用方的事。
 */
function finalizeRoles(){
  const taken = new Set();
  G.players.forEach(p => { if (p.char) taken.add(p.char.id); });
  // 真人没选走的那几张候选回归武将池
  const pool = (G.charRest || []).slice();
  G.players.forEach(p => {
    (p.charChoices || []).forEach(x => { if (!taken.has(x.id)) pool.push(x); });
  });
  G.players.forEach(p => {
    if (p.char) return;
    const pick = aiPickChar(p, taken, pool);
    taken.add(pick.id);
    p.char = pick;
  });
  // 兜底校验：绝不允许两个座位拿到同一个角色
  const ids = G.players.map(p => p.char && p.char.id);
  if (new Set(ids).size !== ids.length){
    const used = new Set();
    G.players.forEach(p => {
      if (!p.char || used.has(p.char.id)){
        const alt = D.CHARACTERS.find(x => !used.has(x.id));
        if (alt) p.char = alt;
      }
      used.add(p.char.id);
    });
    log('⚠ 检测到重复角色，已自动替换为不同角色', 'dmg');
  }
}

function dealInitialHands(){
  for (const p of G.players){
    let n = 4;
    if (p.identity === 'dean') n = 5;
    if (G.players.length === 4 && p.identity === 'student') n = 5;
    for (let i=0;i<n;i++){
      const c = G.deck.pop();
      if (c) p.hand.push(c);

function finalizeGame(){
  const G2 = G;
  G2.deck = shuffle(D.buildDeck());
  G2.discard = [];
  // 院长先手
  const dean = G2.players.find(p => p.identity === 'dean');
  G2.turnSeat = dean.seat;
  // 体力与起手
  for (const p of G2.players){
    p.maxHp = p.char.hp + (p.identity === 'dean' ? 1 : 0);
    p.hp = p.maxHp;
  }
}
async function gameLoop(){
  const myGen = G.gen;
  while (!G.over && G.gen === myGen){
    const p = G.players[G.turnSeat];
    if (p && p.alive){
      await runTurn(p);
      if (G.over) break;
    }
    // 下一名存活角色
    let next = G.turnSeat;
    for (let i=1;i<=G.players.length;i++){
      const idx = (G.turnSeat + i) % G.players.length;
      if (G.players[idx].alive){ next = idx; break; }
    }
    // 只剩一个人活着了，没人可轮 —— 胜负交给 checkVictory 判。
    // 注意别在这里先写 G.over：checkVictory 和 endGame 开头都有 `if (G.over) return`，
    // 先写就等于把它们整个跳过，结果是**不弹结算界面**就黑在那里。
    if (next === G.turnSeat){ checkVictory(); break; }
    const wrapped = next <= G.turnSeat;
    G.turnSeat = next;
    if (G.players.filter(x=>x.alive).length <= 1) { checkVictory(); if (G.over) break; }
    if (wrapped){
      G.round++;
      G.firstRound = false;
      log('===== 第 ' + G.round + ' 轮开始 =====', 'big');
      // 打太久了判平局。这里同样必须走 endGame（它自己会写 G.over 并弹结算）——
      // 以前是先写 G.over，于是 endGame 直接在门口返回：一局磨到 40 轮之后
      // 界面就那么停在棋盘上，既没结算也没法继续。
      if (G.round > 40){ endGame(null, '回合数过多，判定平局'); break; }
    }
  }
  // 收尾。循环有两种退出方式：这局真的打完了，或者 G.gen 变了（有人开了新的一局）。
  // 后一种情况下本局已经作废，**绝不能**再去动 G —— 那会把刚开的新局标成已结束，
  // 表现是新局一进去就"游戏结束"、什么都点不动。
  // 触发场景很日常：一局还没跑完（比如正好轮到电脑）就点「再来一局」或「新手教学局」。
  //
  // 还留在这里则说明循环没停在"已分出胜负"上（某个 break 漏设了 G.over）：
  // 先让 checkVictory 判，判不出来就当平局收尾 —— 无论如何都得有个结算界面。
  // 注意别自己先写 G.over：checkVictory / endGame 开头都有 `if (G.over) return`。
  if (G.gen === myGen && !G.over){
    checkVictory();
    if (!G.over) endGame(null, '对局结束');
  }
}

  if (isTurn) div.classList.add('turn');
  // 点棋盘选目标：合法的加 targetable，已选的加 selected
  // （这两个类的样式在 style.css 里本来就有，只是之前一直没人用）
  if (targeting){
    if (targeting.cands.indexOf(p) >= 0) div.classList.add('targetable');
    if (targeting.chosen.indexOf(p) >= 0) div.classList.add('selected');
  }
  if (thinkingSeats.has(p.seat)) div.classList.add('thinking');
  const idTag = identityTag(p, isMe);
  let hpPips = '';
  for (let i=1;i<=p.maxHp;i++) hpPips += '<span class="hp-pip' + (i <= p.hp ? ' on' : '') + (p.identity==='mole'&&isMe?' mole-hp':'') + '"></span>';
  // 装备与通知栏用 DOM 元素生成，便于长按查看牌面
  const marks = [];
  if (p.marks.buff) marks.push('<span class="pp-tag warn">红牛 ×' + p.marks.buff + '</span>');
  if (p.chained) marks.push('<span class="pp-tag warn">横置</span>');
  if (p.dodgeBan) marks.push('<span class="pp-tag warn">禁代课</span>');
  if (p.marks.pigeon) marks.push('<span class="pp-tag warn">鸽王</span>');
  if (p.marks.net) marks.push('<span class="pp-tag warn">断网</span>');
  if (p.pointBan) marks.push('<span class="pp-tag warn">禁点名</span>');
  const dmgBonus = p.char && E.hasSkill(p,'体能') ? '<span class="pp-tag">手牌上限+1</span>' : '';

  const known = p.revealed || p.identity === 'dean' || isMe;
  const avatarCls = known ? D.IDENTITIES[p.identity].cls : '';
  // 距离信息（相对人类玩家，直观体现"围圈坐"）
  let distTags = '';
  const me = G.players[G.humanSeat];
  if (me && !isMe && p.alive && me.alive && window.Engine){
    const d = E.distance(me, p), rng = E.attackRange(me);
    const inR = d <= rng;
    distTags = '<span class="pp-tag dist">距你 ' + d + '</span>';
    if (G.players[G.turnSeat] === me)
      distTags += '<span class="pp-tag ' + (inR ? 'good' : 'out') + '">' + (inR ? '可点名' : '范围外') + '</span>';
  }
  // 等待真人决策时的读秒（联机时房主把「正在问谁、什么时候超时」放进快照）
  let thinkTag = '';
  if (thinkingSeats.has(p.seat) && !isMe){
    thinkTag = '<span class="pp-think" data-until="' + (thinkingUntil[p.seat] || 0) + '">思考中…</span>';
  }
  div.innerHTML =
    (isTurn ? '<div class="pp-turn-ribbon">▶ 当前回合</div>' : '') +
    '<div class="pp-head">' +
      '<div class="pp-avatar ' + avatarCls + '">' + (p.char ? p.char.name.charAt(0) : '?') + '</div>' +
      '<div style="flex:1;min-width:0"><div class="pp-name">' + p.name + (isMe ? ' <span style="color:#8fb8e8;font-size:12px">（你）</span>' : '') + '</div>' +
    '<div class="pp-title">' + (p.char ? p.char.title : '') + '</div></div>' +
    '<div style="text-align:right">' + idTag + '<div class="pp-seat">' + (p.seat+1) + ' 号位</div></div></div>' +
    '<div class="pp-hp">' + hpPips + '<span class="hp-num">' + Math.max(0,p.hp) + '/' + p.maxHp + '</span></div>' +
    '<div class="pp-row"><span class="pp-tag">手牌 ' + p.hand.length + '</span>' + marks.join('') + dmgBonus + distTags + '</div>' +
    thinkTag;
  // 装备区
  const gbox = document.createElement('div');
  gbox.className = 'pp-gears';
  D.EQUIP_SLOTS.forEach(k => {
    if (!p.equips[k]) return;
    gbox.appendChild(chipWithDetail(p.equips[k].name, p.equips[k], 'gear-chip'));
  });
  if (gbox.children.length) div.appendChild(gbox);
  // 通知栏：延时类事件牌以小卡形式贴在角色面板上
  if (p.judge.length){
    const wrap = document.createElement('div');
    wrap.className = 'pp-judge-wrap';
    const lab = document.createElement('span');
    lab.className = 'pp-judge-label';
    lab.textContent = '通知栏';
    wrap.appendChild(lab);
    const row = document.createElement('div');
    row.className = 'pp-judge-cards';
    const ordered = p.judge.slice().reverse();      // 后进先出：最左侧最先结算
    ordered.forEach((c, i) => {
      const mc = miniCard(c);
      if (i === 0) mc.classList.add('next');
      mc.title = c.name + (i === 0 ? '（下一个结算）' : '');
      row.appendChild(mc);
    });
    wrap.appendChild(row);
    div.appendChild(wrap);
  }
  // 长按查看角色技能详情
  if (window.FX) FX.bindLongPress(div, () => FX.showCharDetail(p));
  return div;
}

/** 通知栏用的小卡（贴在角色面板上，直观显示身上的延时牌） */
function miniCard(card){
  const el = document.createElement('div');
  const red = D.isRedCard(card);
  el.className = 'mini-card ' + (red ? 'red' : 'black');
  el.innerHTML = '<span class="m-rank">' + D.rankLabel(card.rank) + '</span>' +
                 '<span class="m-suit">' + D.suitOf(card).sym + '</span>' +
                 '<span class="m-name">' + card.name + '</span>';
  el.addEventListener('pointerdown', e => e.stopPropagation());
  if (window.FX) FX.bindLongPress(el, () => FX.showCardDetail(card));
  return el;
}

/** 生成带"长按查看牌面"的小标签 */
function chipWithDetail(text, card, cls){
  const chip = document.createElement('span');
  chip.className = cls;
  chip.textContent = text;
  chip.addEventListener('pointerdown', ev => ev.stopPropagation());   // 避免同时触发面板长按
  if (window.FX && card) FX.bindLongPress(chip, () => FX.showCardDetail(card));
  return chip;
}

function renderOpponents(){
  const box = document.getElementById('opponents');
  if (!box) return;
  // 飘字/震动是挂在角色面板上的，而下面要清空重建整个座位区。
  // 不把正在播放的飘字摘出来再挂回去的话，联机时每次状态同步都会把
  // "受伤 -2"这类飘字瞬间抹掉（单机下也偶发，联机下会被放大成"动画全废"）。
  const floats = [];
  box.querySelectorAll('.fx-float, .chat-bubble').forEach(f => { floats.push([f.dataset.seat, f]); });
  box.innerHTML = '';

  const n = G.players.length;
  const meSeat = G.humanSeat;
  const ring = (layoutMode() === 'ring') && n > 1;
  box.classList.toggle('ring', ring);
  // 出牌区也要知道现在是圆桌，好给中间留白（见 style.css 的 #board-main.ring）
  const bm = document.getElementById('board-main');
  if (bm) bm.classList.toggle('ring', ring);
  box.classList.remove('ring-compact', 'ring-mini');
  if (ring){
    // 人一多面板就会互相压住，用 style.css 里原本就备好的两档尺寸收一下
    if (n >= 7) box.classList.add('ring-mini');
    else if (n >= 6) box.classList.add('ring-compact');
  }

  // 圆桌半径按**实测容器尺寸**算，不用百分比：百分比在 4 人局（左右两个面板正好
  // 顶到边缘）会溢出去压到日志栏，底部那个也会顶穿到出牌区上面。
  // 量容器：优先量父节点。这是有意的 —— ring 模式下 #opponents 是 inset:0 的绝对定位，
  // 尺寸来自父容器；而它自己此刻是**空的**（下面才填面板），量它自己会拿到 0 高度，
  // 摆位就会被守卫跳过（页面隐藏时 UI.render 也会遇到同样情形）。
  let ringW = 0, ringH = 0;
  if (ring){
    const host = box.parentElement || box;
    const hr = host.getBoundingClientRect();
    ringW = hr.width || 0;
    ringH = hr.height || 0;
    if (ringW < 80 || ringH < 80){          // 父容器也没尺寸就退回量自己
      const br = box.getBoundingClientRect();
      ringW = br.width || 0;
      ringH = br.height || 0;
    }
  }

  G.players.forEach(p => {
    const el = panelEl(p, p.seat === meSeat);
    el.classList.add('row-seat');
    if (p.seat === meSeat) el.classList.add('is-me');
    if (ring && ringW > 40 && ringH > 40){
      // 以「我」为基准摆圆：我在正下方，出牌顺序沿顺时针推进。
      // 这样"相邻"就是真的挨着，距离感比横向队列直观得多。
      const idx = (((p.seat - meSeat) % n) + n) % n;
      const ang = Math.PI / 2 + (idx / n) * Math.PI * 2;
      const pw = el.offsetWidth || 238;
      const ph = el.offsetHeight || 170;
      const rx = Math.max(0, (ringW - pw) / 2 - 6);
      // 纵向多留 16px：面板顶上有「当前回合」缎带，不留的话顶部那个会被切掉
      const ry = Math.max(0, (ringH - ph) / 2 - 16);
      el.style.left = (ringW / 2 + rx * Math.cos(ang)).toFixed(0) + 'px';
      el.style.top  = (ringH / 2 + ry * Math.sin(ang)).toFixed(0) + 'px';
      el.style.transform = 'translate(-50%,-50%)';
    } else {
      el.style.left = ''; el.style.top = ''; el.style.transform = '';
    }
    el.addEventListener('click', () => onTargetClick(p, el));
    box.appendChild(el);
  });

  // 把还在播的飘字挂回对应座位
  floats.forEach(([seat, el]) => {
    const panel = box.querySelector('.player-panel[data-seat="' + seat + '"]');
    if (panel) panel.appendChild(el);
  });
}

function renderHand(){
  const box = document.getElementById('my-hand');
  if (!box) return;
  const me = G.players[G.humanSeat];
  const hint0 = document.getElementById('hand-hint');
  if (!me){
    // 旁观席：humanSeat 是 -1，没有手牌可渲染
    box.innerHTML = '';
    if (hint0) hint0.textContent = '你正在旁观本局　·　长按任意牌 / 角色可查看详情';
    return;
  }
  box.innerHTML = '';
  const playableNames = new Set();
  if (playMode){
    playMode.playable.forEach(it => playableNames.add(it.card.name));
  }
  sortedHand(me.hand).forEach(c => {
    const isPlayable = playMode && playableNames.has(c.name);
    const el = cardEl(c, {
      dim: playMode && !isPlayable,
      onClick: (card) => { if (playMode && isPlayable) onHandCardClick(card); }
    });
    if (isPlayable) el.classList.add('playable');
    box.appendChild(el);
  });
  const hint = document.getElementById('hand-hint');
  if (hint){
    // 手牌超过上限时**提前**警告：等到弃牌阶段才说就晚了，
    // 出牌阶段本来可以再打几张牌避免弃牌。
    const limit = E.handLimit(me);
    const over = me.hand.length - limit;
    const warn = (over > 0)
      ? '<span class="hand-warn">手牌 ' + me.hand.length + ' / 上限 ' + limit +
        '　出牌阶段结束时需弃 ' + over + ' 张</span>'
      : '';
    hint.innerHTML = (playMode
      ? '点击高亮手牌使用（无目标牌会直接结算），然后<b>点角色面板</b>选目标　·　长按看详情'
      : '等待其他玩家行动……　·　长按任意牌 / 角色可查看详情') + warn;
  }
}

/* 手牌排序：按「基本牌 → 装备 → 事件 → 延时」分组，同名牌相邻，组内点数大的在前。
   只是显示顺序，绝不动 me.hand 本身（引擎靠数组顺序和对象同一性做事）。 */
const CARD_TYPE_ORDER = { basic:0, equip:1, event:2, delayed:3 };
function cardTypeRank(c){
  const meta = CARDS[c.name];
  const t = meta && meta.type;
  return (CARD_TYPE_ORDER[t] === undefined) ? 9 : CARD_TYPE_ORDER[t];
}
function sortedHand(hand){
  return hand.slice().sort((a, b) => {
    const ta = cardTypeRank(a), tb = cardTypeRank(b);
    if (ta !== tb) return ta - tb;
    if (a.name !== b.name) return a.name < b.name ? -1 : 1;
    return (b.rank || 0) - (a.rank || 0);
  });
}

function renderActions(){
  const box = document.getElementById('actions');
  if (!box) return;
  box.innerHTML = '';
  const me = G.players[G.humanSeat];
  const isMyPlay = playMode && G.players[G.turnSeat] === me;
  if (isMyPlay){
    playMode.skills.forEach(s => {
      const tg = s.eqSkill ? [me] : E.skillTargets(me, s);
      const btn = document.createElement('button');
      btn.className = 'skill';
      btn.textContent = '【' + s.name + '】';
      btn.title = s.desc || '';
      btn.disabled = tg.length === 0;
      btn.addEventListener('click', () => onSkillClick(s, tg));
      box.appendChild(btn);
    });
    const end = document.createElement('button');
    end.className = 'primary';
    end.textContent = '结束出牌阶段';
    end.addEventListener('click', () => {
      const fn = resolvePlay; playMode = null; resolvePlay = null; targeting = null; UI.render();
      if (fn) fn({ action:{ type:'end' } });
    });
    box.appendChild(end);
  } else {
    const span = document.createElement('span');
    span.style.color = '#8fa0b5';
    span.style.fontSize = '13px';
    span.textContent = G.over ? '游戏已结束' : (G.players[G.turnSeat] ? '当前回合：' + G.players[G.turnSeat].name : '');
    box.appendChild(span);
  }
}

/* ---------------- 弹窗基础 ---------------- */
function closeModal(){
  const layer = document.getElementById('modal-layer');
  layer.classList.remove('show');
  layer.innerHTML = '';
  layer._esc = null;      // 键盘处理用（见文件末尾的 keydown）
}
UI.closeModal = closeModal;

function modal(opts){
  const layer = document.getElementById('modal-layer');
  layer.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'modal';
  const h = document.createElement('h3');
  h.textContent = opts.title || '';
  box.appendChild(h);
  if (opts.desc){
    const d = document.createElement('div');
    d.className = 'm-desc';
    d.innerHTML = opts.desc;
    box.appendChild(d);
  }
  const body = document.createElement('div');
  body.className = 'm-body';
  if (opts.body) body.appendChild(opts.body);
  box.appendChild(body);
  const acts = document.createElement('div');
  acts.className = 'm-actions';
  (opts.actions || []).forEach(a => {
    const b = document.createElement('button');
    b.textContent = a.label;
    if (a.cls) b.className = a.cls;
    if (a.disabled) b.disabled = true;
    b.dataset.key = a.key || '';
    b.addEventListener('click', a.onClick);
    acts.appendChild(b);
  });
  box.appendChild(acts);
  layer.appendChild(box);
  layer.classList.add('show');
  // 只有能安全取消的弹窗才允许按 Esc 关掉（否则引擎会一直等这个答复）
  layer._esc = opts.esc || null;
  return { box, body, actions: acts, setEnabled: (key, on) => {
    const b = acts.querySelector('button[data-key="' + key + '"]');
    if (b) b.disabled = !on;
  }};
}
UI.modal = modal;

/* ---------------- 人类交互入口 ---------------- */

/* 当前挂起的那个询问（用来在游戏结束时取消它）。
   出牌阶段的 resolvePlay（第 13 行）就是这里的 done，所以取消出牌阶段能一起处理。 */
let pendingResolve = null;

UI.askHuman = function(req){
  if (window.Tutorial) Tutorial.notify('ask', { req: req });
  return new Promise(resolve => {
    const done = r => {
      if (pendingResolve === done) pendingResolve = null;
      resolve(r);
    };
    pendingResolve = done;
    switch (req.kind){
      case 'playPhase':  return askPlayPhase(req, done);
      case 'choice':     return askChoice(req, done);
      case 'selectCards':return askSelectCards(req, done);
      case 'selectTargets': return askTargets(req, done);
      case 'selectOption': return askOption(req, done);
      default: resolve({});
    }
  });
};

/**
 * 取消当前挂起的询问（联机时主机会在游戏结束等情况下发这个消息）。
 * 出牌阶段用 {action:{type:'end'}} 收尾 —— engine.js:1624 的结束判断能正确处理它；
 * 对其他询问返回空对象，engine 里 req 的接收方都有兜底。
 */
UI.cancelAsk = function(){
  closeModal();
  const wasPlay = !!resolvePlay;
  playMode = null; resolvePlay = null;
  targeting = null;
  if (wasPlay && pendingResolve){ const fn = pendingResolve; pendingResolve = null; fn({ action:{ type:'end' } }); }
  else if (pendingResolve){ const fn = pendingResolve; pendingResolve = null; fn({}); }
  UI.render();
};

/* ---- 出牌阶段 ---- */
function askPlayPhase(req, resolve){
  playMode = req;
  resolvePlay = resolve;
  targeting = null;
  UI.render();
}
function canTargetOther(me, target, card, opts){
  // 划水限制
  if (target.marks && target.marks.slideTurn === G.turnId && target.marks.slideFrom === me.seat) return false;
  if (card && CARDS[card.name].tag === 'probe' && E.hasSkill(target, '潜行')) return false;
  if (card && card.name === '课堂辩论' && E.hasSkill(target, '伦理')) return false;
  return true;
}
function onHandCardClick(card){
  const me = G.players[G.humanSeat];
  const meta = CARDS[card.name];
  const kind = meta.kind;

  // 无目标牌
  if (['draw2','harvest','aoeAttack','massHeal','lightning'].includes(kind)){
    const targets = finishAutoTargets(me, card);
    return finishPlay({ type:'card', card, targets });
  }
  if (kind === 'equip') return finishPlay({ type:'card', card, targets: [] });
  if (kind === 'heal' || kind === 'buff') return finishPlay({ type:'card', card, targets: [me] });

  // 需要目标 —— 点棋盘上的角色面板选人（弹窗降级成「列表选择」）
  const cands = E.validTargets(me, card).filter(t => canTargetOther(me, t, card));
  if (!cands.length){ UI.toast('没有合法目标', 'warn'); return; }
  const isHei = (card.name === '上课点名' && me.equips.weapon && me.equips.weapon.name === '黑板擦' && me.hand.length === 1);
  const maxT = isHei ? 3 : (kind === 'chain' ? 2 : 1);
  const fire = tg => finishPlay({ type:'card', card, targets: tg });
  beginTargeting({
    cands, min:1, max:maxT,
    title: '使用【' + card.name + '】',
    hint: kind === 'chain' ? '可横置 / 重置角色' : '',
    extra: kind === 'chain' ? [{
      label: '重铸（弃置并摸一张）',
      onClick: () => { endTargeting(false); finishPlay({ type:'card', card, targets: [], recast:true }); }
    }] : [],
    onConfirm: fire,
    onCancel: () => {},
    listFallback: () => askTargetList('使用 ' + card.name,
      '请选择目标（1' + (maxT > 1 ? '–' + maxT : '') + ' 名）' +
      (kind === 'chain' ? '　可横置/重置角色' : ''), cands, 1, maxT, fire)
  });
}

/** 弹窗列表选目标：点棋盘不方便时的兜底（手机小屏、8 人局等） */
function askTargetList(title, desc, cands, min, max, onOk, onCancel){
  const me = G.players[G.humanSeat];
  const chosen = [];
  const body = document.createElement('div');
  body.className = 'm-targets';
  const m = modal({
    title: title, desc: desc, body,
    actions: [
      { label:'确定', cls:'primary', key:'ok', onClick: () => {
          if (chosen.length < min) return;
          closeModal(); onOk(chosen.slice());
      }},
      { label:'取消', onClick: () => { closeModal(); if (onCancel) onCancel(); } }
    ],
    esc: () => { closeModal(); if (onCancel) onCancel(); }
  });
  cands.forEach(t => {
    const pill = document.createElement('div');
    pill.className = 'target-pill';
    pill.innerHTML = t.name + ' <span style="color:#8fa0b5;font-size:12px">' + t.hp + '/' + t.maxHp +
      (me ? ' · 距离' + E.distance(me, t) : '') + ' · 手牌' + t.hand.length + '</span>';
    pill.addEventListener('click', () => {
      const i = chosen.indexOf(t);
      if (i >= 0){ chosen.splice(i,1); pill.classList.remove('sel'); }
      else {
        if (chosen.length >= max) return;
        chosen.push(t); pill.classList.add('sel');
      }
      m.setEnabled('ok', chosen.length >= min);
    });
    body.appendChild(pill);
  });
  m.setEnabled('ok', chosen.length >= min);
  return m;
}
function finishAutoTargets(me, card){
  const kind = CARDS[card.name].kind;
  if (kind === 'aoeAttack') return E.others(me);
  if (kind === 'massHeal' || kind === 'harvest') return E.alivePlayers();
  if (kind === 'lightning') return [me];
  if (kind === 'draw2') return [me];
  return [];
}
function finishPlay(action){
  const fn = resolvePlay;
  playMode = null; resolvePlay = null;
  targeting = null;          // 出牌流程结束时一定要退出选目标状态
  UI.render();
  if (fn) fn({ action });
}
function onSkillClick(skill, targets){
  const me = G.players[G.humanSeat];
  if (skill.eqSkill) return equipSkillFlow(skill, me);
  if (!skill.needTarget) return finishPlay({ type:'skill', skill, targets: [] });
  const cands = targets.slice();
  if (!cands.length){ UI.toast('没有合法目标', 'warn'); return; }
  const fire = tg => finishPlay({ type:'skill', skill, targets: tg });
  // 主动技同样走「点棋盘选人」，和出牌保持一致的手感
  beginTargeting({
    cands, min:1, max:1,
    title: '发动【' + skill.name + '】',
    hint: skill.desc || '',
    onConfirm: fire,
    onCancel: () => {},
    listFallback: () => askTargetList('发动【' + skill.name + '】', skill.desc, cands, 1, 1, fire)
  });
}

/* ---- 武器转化技：电风扇 / 粉笔 ---- */
async function equipSkillFlow(skill, me){
  let cost = [], asName = '上课点名', dmg = 'normal', suit = 'C', rank = 8;
  if (skill.name === '电风扇·转化'){
    const r = await UI.askHuman({ kind:'selectCards', player:me, from:'self', min:1, max:1,
      prompt:'【电风扇】选择一张"上课点名"当"公开处刑"使用', filter:c => c.name === '上课点名' });
    if (!r.cards || !r.cards.length) return;
    cost = [r.cards[0]]; asName = '公开处刑'; dmg = 'fire';
    suit = r.cards[0].suit; rank = r.cards[0].rank;
  } else {
    const r = await UI.askHuman({ kind:'selectCards', player:me, from:'self', min:2, max:2,
      prompt:'【粉笔】选择两张手牌当作一张"上课点名"' });
    if (!r.cards || r.cards.length < 2) return;
    cost = r.cards.slice(); asName = '上课点名'; dmg = 'normal';
    suit = cost[0].suit; rank = cost[0].rank;
  }
  const cands = E.validTargets(me, { name: asName, kind:'attack' });
  if (!cands.length){ UI.toast('没有合法目标', 'warn'); return; }
  const t = await UI.askHuman({ kind:'selectTargets', player:me, targets:cands, min:1, max:1,
    prompt:'选择目标（' + asName + '）' });
  if (!t.targets || !t.targets.length) return;
  finishPlay({ type:'virtual', cost, asName, dmg, suit, rank, targets:t.targets });
}

function askChoice(req, resolve){
  modal({
    title: req.player ? '「' + req.player.name + '」的决策' : '请选择',
    desc: req.prompt,
    actions: (req.options || []).map(o => ({
      label: o.label, cls: o.key === 'yes' || o.key === 'card' ? 'primary' : '',
      onClick: () => { closeModal(); resolve({ option: o.key }); }
    }))
  });
}
/* ---- 选牌 ---- */
function askSelectCards(req, resolve){
  let pool;
  if (req.cards) pool = req.cards.slice();
  else {
    const me = G.players[G.humanSeat];
    if (!me){ resolve({ cards: [] }); return; }     // 旁观席不该被问到，兜底
    if (req.from === 'any'){
      pool = me.hand.concat(D.EQUIP_SLOTS.map(k => me.equips[k]).filter(Boolean));
    } else pool = me.hand.slice();
  }
  if (req.filter) pool = pool.filter(req.filter);
  if (!pool.length){ resolve({ cards: [] }); return; }
  const min = req.min || 0, max = req.max || 1;
  const chosen = [];
  const body = document.createElement('div');
  body.className = 'm-cards';
  const owner = req.owner ? req.owner.name + ' 的' : '你的';
  const m = modal({
    title: (req.player ? '「' + req.player.name + '」· ' : '') + (req.prompt || '选择卡牌'),
    desc: '选择 ' + min + (max > min ? '–' + max : '') + ' 张' + owner + '牌',
    body,
    actions:[
      { label:'确定', cls:'primary', key:'ok', onClick: () => {
          closeModal(); resolve({ cards: chosen.slice() });
      }},
      { label:'取消', onClick: () => { closeModal(); resolve({ cards: [] }); } }
    ],
    esc: () => { closeModal(); resolve({ cards: [] }); }
  });
  pool.forEach(c => {
    const el = cardEl(c, { onClick: (card, div) => {
      const i = chosen.indexOf(card);
      if (i >= 0){ chosen.splice(i,1); div.classList.remove('sel'); }
      else {
        if (chosen.length >= max) return;
        chosen.push(card); div.classList.add('sel');
      }
      m.setEnabled('ok', chosen.length >= min && chosen.length <= max);
    }});
    body.appendChild(el);
  });
  m.setEnabled('ok', min === 0);
}

/* ---- 选目标 ---- */
function askTargets(req, resolve){
  const min = req.min || 1, max = req.max || 1;
  const cands = (req.targets || []).slice();
  const title = (req.player ? '「' + req.player.name + '」· ' : '') + (req.prompt || '选择目标');
  if (!cands.length){ resolve({ targets: [] }); return; }
  const ok = tg => resolve({ targets: tg });
  const cancel = () => resolve({ targets: [] });
  // 引擎发来的选目标请求也走「点棋盘」——这样出牌、主动技、点名接力
  // 全游戏的目标选择手感一致，不再有的点人、有的在弹窗里找名字。
  beginTargeting({
    cands, min, max, title,
    onConfirm: ok,
    onCancel: cancel,
    listFallback: () => askTargetList(
      title, '请选择目标（' + min + (max > min ? '–' + max : '') + ' 名）',
      cands, min, max, ok, cancel)
  });
}

/* ---------------- 本机战绩（存在浏览器里，跨局累计） ---------------- */
const RECORD_KEY = 'dqk_record';
function readRecord(){
  const d = { games:0, wins:0, mvps:0, best:0 };
  try { return Object.assign(d, JSON.parse(localStorage.getItem(RECORD_KEY) || '{}')); }
  catch (e){ return d; }
}
/** 记一笔本机战绩。旁观席（humanSeat < 0）不算。 */
function recordResult(humanWin, board){
  if (G.humanSeat < 0) return readRecord();
  const rec = readRecord();
  rec.games++;
  if (humanWin) rec.wins++;
  if (board && board.mvpSeat === G.humanSeat) rec.mvps++;
  const mine = board && board.rows.find(r => r.seat === G.humanSeat);
  if (mine && mine.score > rec.best) rec.best = mine.score;
  try { localStorage.setItem(RECORD_KEY, JSON.stringify(rec)); } catch (e){ /* 忽略 */ }
  return rec;
}

/* ---------------- 结束界面 ---------------- */
UI.showOver = function(winner, reason, humanWin, board){
  if (window.Tutorial) Tutorial.notify('over', {});
  const title = document.getElementById('over-title');
  const body = document.getElementById('over-body');
  title.textContent = humanWin ? '你赢了' : (winner ? '你输了' : '平局');
  title.style.color = humanWin ? '#5ac47e' : '#e05a5a';

  const mySeat = G.humanSeat;
  // 先记战绩，再渲染（渲染里要显示累计结果）
  const rec = (mySeat >= 0) ? recordResult(humanWin, board) : readRecord();

  let html = '<div class="ov-line">' +
    (winner ? D.IDENTITIES[winner].name + '阵营胜利' : '平局') +
    '　<span style="color:#8fa0b5">（' + reason + '）</span></div>';

  /* ---- MVP ---- */
  if (board && board.mvpSeat >= 0){
    const m = board.rows.find(r => r.seat === board.mvpSeat);
    const mine = (board.mvpSeat === mySeat);
    html += '<div class="ov-mvp' + (mine ? ' me' : '') + '">' +
      '<span class="mvp-badge">MVP</span>' +
      '<span class="mvp-who">' + (m.seat + 1) + ' 号位　' + m.name + '</span>' +
      '<span class="mvp-score">' + m.score + ' 分</span>' +
      (mine ? '<span class="mvp-you">就是你 🎉</span>' : '') +
      '</div>';
  }

  /* ---- 评分表 ---- */
  if (board && board.rows){
    html += '<div class="ov-sec">评分</div>' +
      '<table class="score-table"><thead><tr>' +
      '<th>座位</th><th>角色</th><th>身份</th><th>结果</th>' +
      '<th>伤害</th><th>击杀</th><th>救援</th><th>治疗</th><th>技能</th><th>总分</th>' +
      '</tr></thead><tbody>';
    board.rows.forEach(r => {
      const id = D.IDENTITIES[r.identity] || { name:'?', cls:'' };
      const cls = [];
      if (r.seat === board.mvpSeat) cls.push('mvp');
      if (r.seat === mySeat) cls.push('me');
      if (r.win) cls.push('won');
      html += '<tr class="' + cls.join(' ') + '">' +
        '<td>' + (r.seat + 1) + '</td>' +
        '<td>' + r.name + '</td>' +
        '<td class="' + id.cls + '">' + id.name + '</td>' +
        '<td>' + (r.win ? '<span class="w">胜</span>' : (winner ? '负' : '平')) + '</td>' +
        '<td>' + r.stats.dmg + '</td>' +
        '<td>' + r.stats.kills + '</td>' +
        '<td>' + r.stats.saves + '</td>' +
        '<td>' + r.stats.heals + '</td>' +
        '<td>' + r.stats.skills + '</td>' +
        '<td class="sc">' + r.score + '</td></tr>';
    });
    html += '</tbody></table>' +
      '<p class="score-note">胜利 +30　造成伤害 每点 +3　击杀 +15　救援濒死 +12　' +
      '治疗他人 每点 +4　发动技能 每次 +2（上限 20）　存活到终局 +8</p>';
  }

  /* ---- 身份揭示 ---- */
  html += '<div class="ov-sec">身份揭示</div>';
  G.players.forEach(p => {
    const id = D.IDENTITIES[p.identity];
    const me = p.seat === mySeat;
    const win = (winner === 'dean' && (p.identity === 'dean' || p.identity === 'staff')) ||
                (winner === 'student' && p.identity === 'student') ||
                (winner === 'mole' && p.identity === 'mole');
    html += '<div class="ov-line' + (win ? ' ov-win' : '') + '">' +
      (p.seat + 1) + ' 号位　' + p.char.name + '（' + p.char.title + '）　' +
      '<b>' + id.name + '</b>　' + (p.alive ? '存活' : '死亡') + (me ? '　← 你' : '') + (win ? '　✔ 胜利' : '') + '</div>';
  });

  /* ---- 本机战绩 ---- */
  if (mySeat >= 0 && rec.games > 1){
    html += '<div class="ov-sec">本机战绩</div>' +
      '<div class="ov-line">共 ' + rec.games + ' 局　胜 <b>' + rec.wins + '</b>　' +
      'MVP <b>' + rec.mvps + '</b> 次　最高分 <b>' + rec.best + '</b></div>';
  }

  body.innerHTML = html;
  UI.show('over');
};

UI.updateReplayBar = function(){
  const bar = document.getElementById('replay-bar');
  if (!bar || bar.classList.contains('hide')) return;
  const R = window.Net && Net.replay;
  if (!R || !R.data) return;
  const total = R.data.frames.length;
  const pos = Math.min(R.idx, total);
  const fill = document.getElementById('rb-fill');
  if (fill) fill.style.width = (total ? (pos / total * 100) : 0).toFixed(1) + '%';
  const tgl = document.getElementById('rb-toggle');
  if (tgl) tgl.textContent = R.playing ? '⏸ 暂停' : (pos >= total ? '↻ 重播' : '▶ 播放');
  const posEl = document.getElementById('rb-pos');
  if (posEl) posEl.textContent = pos + ' / ' + total + ' 帧';
  [1, 2, 4].forEach(v => {
    const b = document.getElementById('rb-s' + v);
    if (b) b.classList.toggle('on', Math.abs(R.speed - v) < 0.01);
  });
};

UI.bindReplayBar = function(){
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
  on('rb-toggle', () => window.Net.toggleReplay());
  on('rb-s1', () => window.Net.setReplaySpeed(1));
  on('rb-s2', () => window.Net.setReplaySpeed(2));
  on('rb-s4', () => window.Net.setReplaySpeed(4));
  on('rb-exit', () => window.Net.stopReplay());
};

/* ---------------- 弃牌堆查看 ---------------- */
/* 弃牌堆是公开信息（每次弃牌都写进了日志），只是以前顶栏只显示一个数字。
   能翻弃牌堆，老手才能数牌 —— 这是牌类游戏最基本的深度来源之一。 */
UI.showDiscard = function(){
  if (window.Net && Net.requestDiscard){ Net.requestDiscard(); return; }   // 联机：向房主要
  renderDiscard((window.G && G.discard) || []);
};

function renderDiscard(cards){
  const body = document.createElement('div');
  body.className = 'discard-box';
  if (!cards.length){
    body.innerHTML = '<p class="hint">弃牌堆还是空的。</p>';
  } else {
    const map = new Map();
    cards.forEach(c => {
      const e = map.get(c.name) || { name: c.name, list: [] };
      e.list.push(c);
      map.set(c.name, e);
    });
    const rows = Array.from(map.values()).sort((a, b) => b.list.length - a.list.length);
    rows.forEach(r => {
      const el = document.createElement('div');
      el.className = 'discard-row';
      const meta = CARDS[r.name] || {};
      el.innerHTML = '<span class="dr-name">' + r.name + '</span>' +
        '<span class="dr-type">' + (CARD_TYPE_LABEL[meta.type] || '') + '</span>' +
        '<span class="dr-n">×' + r.list.length + '</span>' +
        '<span class="dr-cards">' + r.list.map(c =>
          D.rankLabel(c.rank) + D.suitOf(c).sym).join(' ') + '</span>';
      if (window.FX) FX.bindLongPress(el, () => FX.showCardDetail(r.list[0]));
      body.appendChild(el);
    });
  }
  modal({
    title: '弃牌堆（共 ' + cards.length + ' 张）',
    desc: '所有弃掉的牌都是公开信息 —— 数牌能帮你判断还剩多少张点名、多少张代课。',
    body,
    actions: [{ label:'关闭', cls:'primary', onClick: closeModal }],
    esc: closeModal
  });
}

/* ---------------- 快捷语 ---------------- */
/* 联机时人和人之间原本**没有任何交流手段** —— 等人、催人、吐槽全靠线下喊。
   走已有的消息通道，成本极低。单机时按钮直接藏起来。 */
const CHAT_PRESETS = [
  '稍等，我想想', '快点出牌啦', '我先打你一下，别介意', '我是清白的',
  '你肯定是卧底', '谢谢！', '手下留情', '合作愉快？'
];

/* 快捷语历史。**不进战斗日志** —— 以前一句话塞进日志区，
   四五个人聊两句就把"谁打了谁"这种关键信息顶没了。
   气泡负责即时提醒，历史留在快捷语面板里自己翻。 */
UI.chatHistory = [];

UI.pushChat = function(name, text, seat){
  UI.chatHistory.push({ name: name, text: text, seat: seat, at: Date.now() });
  if (UI.chatHistory.length > 60) UI.chatHistory.shift();
  UI.showChatBubble(seat, text);
};

/** 在某个角色的面板上冒一个气泡（4 秒后自己消失） */
UI.showChatBubble = function(seat, text){
  const panel = document.querySelector('.player-panel[data-seat="' + seat + '"]');
  if (!panel) return;
  const b = document.createElement('div');
  b.className = 'chat-bubble';
  b.dataset.seat = seat;         // renderOpponents 重建座位区时靠它挂回来
  b.textContent = text;
  panel.appendChild(b);
  setTimeout(() => b.remove(), 4000);
};

UI.sendChat = function(text){
  text = String(text || '').trim().slice(0, 30);
  if (!text) return;
  if (window.Net && Net.sendChat) Net.sendChat(text);
  else UI.pushLog(text, 'chat');
};

UI.showChat = function(){
  const body = document.createElement('div');
  body.className = 'chat-box';

  // 历史（聊天不进战斗日志，所以这里得能看到刚才谁说了什么）
  const hist = document.createElement('div');
  hist.className = 'chat-hist';
  if (UI.chatHistory.length){
    hist.innerHTML = UI.chatHistory.slice(-12).map(m =>
      '<div class="ch-line"><b>' + esc(m.name) + '</b>：' + esc(m.text) + '</div>').join('');
    setTimeout(() => { hist.scrollTop = hist.scrollHeight; }, 30);
  } else {
    hist.innerHTML = '<div class="ch-empty">还没有人说话</div>';
  }
  body.appendChild(hist);

  const grid = document.createElement('div');
  grid.className = 'chat-presets';
  CHAT_PRESETS.forEach(t => {
    const b = document.createElement('button');
    b.textContent = t;
    b.addEventListener('click', () => { closeModal(); UI.sendChat(t); });
    grid.appendChild(b);
  });
  body.appendChild(grid);

  const row = document.createElement('div');
  row.className = 'chat-free';
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.maxLength = 30;
  inp.placeholder = '说点什么（最多 30 字）';
  const send = document.createElement('button');
  send.className = 'primary';
  send.textContent = '发送';
  const doSend = () => { const v = inp.value; if (!v.trim()) return; closeModal(); UI.sendChat(v); };
  send.addEventListener('click', doSend);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); doSend(); } });
  row.appendChild(inp);
  row.appendChild(send);
  body.appendChild(row);

  modal({ title:'快捷语', desc:'全场可见，请友善使用', body,
          actions:[{ label:'关闭', onClick: closeModal }], esc: closeModal });
  setTimeout(() => { try { inp.focus(); } catch (e){ /* 忽略 */ } }, 60);
};

      UI.toast(m ? '出牌区：一次连锁结束后等你点击再清空' : '出牌区：一次连锁结束后自动清空', '');
    });

  if (sb && window.FX){
    sb.textContent = FX.soundOn() ? '🔊 音效' : '🔇 静音';

    document.getElementById('log').innerHTML = '';
  });
  const sp = document.getElementById('btn-speed');
  const speedLabel = v => v >= 1.9 ? '很慢' : v >= 1.2 ? '标准' : v >= 0.5 ? '快' : '极速';
  sp.textContent = '节奏：' + speedLabel(G.speed);
  sp.addEventListener('click', () => {
    const modes = [{k:1.35,l:'标准'},{k:1.9,l:'很慢'},{k:0.6,l:'快'},{k:0.15,l:'极速'}];
    const i = modes.findIndex(m => Math.abs(m.k - G.speed) < 0.01);
    const next = modes[(i+1) % modes.length];
    if (window.Net && Net.isOnline && Net.isOnline()){
      // 联机时节奏是**全桌共享**的：由房主改，再由快照下发到每一端，
      // 否则各端动画时长会不一致，看起来像卡顿
      Net.setSpeed(next.k);
    } else {
      G.speed = next.k;
    }
    sp.textContent = '节奏：' + next.l;
    UI.toast('节奏：' + next.l + '（数值 ' + next.k + '×）', '');

/**

 * 现在搬进主代码，两条路都有了（打包补丁再跑一次也是幂等的）。

function applyMobileDefaults(){
  if (!window.matchMedia) return;
  if (!window.matchMedia('(max-width: 900px)').matches) return;
  const sb = document.getElementById('sidebar');
  if (sb) sb.classList.add('hide');
}

};

function showRules(){

      '<b>出牌限制：</b>点名类（上课点名/公开处刑/雷同警告）合计 1 张/回合；延时事件牌 1 张/回合；主动技各 1 次<br>' +
      '<b>距离：</b>相邻为 1；+1 坐骑让别人看你 +1；-1 坐骑让你看别人 -1；最小为 1<br>' +
      '<b>攻击范围：</b>无武器 = 1；由武器牌上的数字决定<br>' +
      '<b>响应链：</b>点名牌 → 代课（抵消）→ 辅导员签字（抵消事件牌）<br>' +
      '<b>判定：</b>翻开牌堆顶作为抽签牌；♥♦ = 红色，♠♣ = 黑色<br>' +
      '<b>濒死：</b>体力 ≤ 0 → 本人先自救 → 从当前回合角色起轮流救援 → 救不回则死亡<br>' +
      '<b>死亡奖惩：</b>杀学生者摸 3 张；院长杀教务 → 院长弃光所有牌<br>' +
      '<b>胜负：</b>学生与卧底全灭且院长存活 = 院方胜；院长死亡 = 学生胜（若仅剩卧底一人则卧底胜）<br>' +
      '<b>手牌上限 = 当前体力</b>（波比【体能】+1）<br>' +
      '<b>操作：</b>点手牌 → 合法目标会在棋盘上描绿边 → 点人选中 → 出手；' +
      'Enter 确认 / Esc 取消 / 数字键按座位号选目标',
    actions:[
      { label: '出手前确认：' + (UI.confirmBeforePlay ? '开' : '关'),
        cls: UI.confirmBeforePlay ? 'on' : '',
        onClick: () => { UI.setConfirmBeforePlay(!UI.confirmBeforePlay); closeModal(); showRules(); } },
      { label:'新手引导', onClick: () => { closeModal(); UI.showTutorial(0); } },
      { label:'运行自检', onClick: () => { closeModal(); if (window.runSelfTest) window.runSelfTest(); } },
      { label:'知道了', cls:'primary', onClick: closeModal }
    ],
    esc: closeModal
  });
}

/* 点角色面板：选目标时用来选人；平时点开角色详情 */
function onTargetClick(p, el){
  if (targeting){
    if (targeting.cands.indexOf(p) >= 0) toggleTarget(p);
    else UI.toast('不是这次能选的目标', 'warn');
    return;
  }
  if (window.FX && FX.showCharDetail) FX.showCharDetail(p);
}

/* ---------------- 键盘操作 ---------------- */
/* 桌面端：Enter 确认 / Esc 取消 / 数字键按座位号选目标。
   出牌区的「点击继续」和详情浮层各有自己的按键处理（见 fx.js），
   这里只在「正在选目标」或「有弹窗」时接管，避免互相打架。

   注意 Esc 只能关**有取消路径**的弹窗：像「是否打出代课」这种必须表态的询问，
   关掉它会让引擎永远等下去。所以能不能 Esc 由 modal({esc}) 显式声明。 */
document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  if (targeting){
    if (e.key === 'Escape'){ e.preventDefault(); endTargeting(false); return; }
    if (e.key === 'Enter'){
      e.preventDefault();
      if (targeting.chosen.length >= targeting.min) endTargeting(true);
      return;
    }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9){
      const p = G.players.find(x => (x.seat + 1) === n);
      if (p && targeting.cands.indexOf(p) >= 0){ e.preventDefault(); toggleTarget(p); }
    }
    return;
  }

  const layer = document.getElementById('modal-layer');
  if (!layer || !layer.classList.contains('show')) return;
  if (e.key === 'Escape'){
    if (typeof layer._esc === 'function'){ e.preventDefault(); layer._esc(); }
    return;
  }
  if (e.key === 'Enter'){
    const ok = layer.querySelector('button[data-key="ok"]');
    if (ok && !ok.disabled){ e.preventDefault(); ok.click(); }
  }
});

UI.showRules = showRules;

/* 横向座位队列由 CSS flex 自动换行，不需要 JS 摆位 */
})();

  <script>/* ===== selftest.js ===== */
/* =========================================================
 *  东秦杀：点名册  ·  规则自检
 *  在浏览器里点"规则 → 运行自检"，或控制台执行 runSelfTest()
 *  会临时构造测试角色，校验装备/距离/免疫/上限等逻辑，跑完自动还原
 * ========================================================= */
(function(){
'use strict';
const D = window.GameData;
const E = window.Engine;

function fakePlayer(seat, opt){
  opt = opt || {};
  const p = {
    seat: seat,
    char: { name: '测试' + seat, title: '自检角色', hp: 4,
            skills: (opt.skills || []).map(n => ({ name: n, type: '锁定技', text: '' })) },
    identity: 'student', hp: opt.hp || 4, maxHp: 4, alive: true,
    hand: opt.hand || [],
    equips: { weapon: null, armor: null, mountUp: null, mountDown: null },
    judge: [], chained: false, marks: {}, isHuman: false, revealed: false,
    skillsUsedThisTurn: {}, usedCardsThisTurn: [], damageDealtThisTurn: 0,
    usedAttackCardThisPhase: opt.used || 0, skip: {},
    dodgeBan: !!opt.dodgeBan, pointBan: !!opt.pointBan
  };
  if (opt.weapon) p.equips.weapon = mkCard(opt.weapon);
  if (opt.armor) p.equips.armor = mkCard(opt.armor);
  // 坐骑按卡片自己的 slot 落到对应栏位（+1 / −1 是两个独立栏位）
  if (opt.mount){ const c = mkCard(opt.mount); p.equips[c.slot] = c; }
  if (opt.mount2){ const c = mkCard(opt.mount2); p.equips[c.slot] = c; }
  return p;
}
function mkCard(name, suit, rank){
  const m = D.CARDS[name] || {};
  return { uid: 0, name, suit: suit || 'S', rank: rank || 7,
           type: m.type, kind: m.kind, dmg: m.dmg || 'normal',
           slot: m.slot || null, range: m.range || 0, mount: m.mount || null,
           tag: m.tag || null, need: m.need || null };
}

function runSelfTest(){
  const results = [];
  const ok = (name, cond, extra) => results.push({ name, pass: !!cond, extra: extra || '' });
  const savedPlayers = G.players, savedSeat = G.turnSeat;
  try {
    /* ---------- 1. 牌堆构成 ---------- */
    const deck = D.buildDeck();
    const byType = { basic:0, event:0, delayed:0, equip:0 };
    deck.forEach(c => byType[c.type]++);
    ok('牌堆总数 = 160', deck.length === 160, '实际 ' + deck.length);
    ok('基本牌 85 张', byType.basic === 85, '实际 ' + byType.basic);
    ok('事件牌 50 张（非延时42 + 延时8）', byType.event === 42 && byType.delayed === 8,
       '实际 ' + byType.event + ' / ' + byType.delayed);
    ok('装备牌 25 张', byType.equip === 25, '实际 ' + byType.equip);
    const eqCount = {};
    deck.filter(c => c.type === 'equip').forEach(c => eqCount[c.name] = (eqCount[c.name] || 0) + 1);
    ok('点名册 2 张', eqCount['点名册'] === 2, '实际 ' + eqCount['点名册']);
    ok('校园卡 2 张 / 雨衣 2 张', eqCount['校园卡'] === 2 && eqCount['雨衣'] === 2);
    ok('坐骑 7 张', ['电动车','平衡车','共享单车','滑板','电摩','地铁','校车']
        .reduce((n,k) => n + (eqCount[k] || 0), 0) === 7);
    // 装备牌必须有 kind='equip'，否则点击使用会提示"没有合法目标"且无法装备
    const badKind = deck.filter(c => c.type === 'equip' && c.kind !== 'equip').map(c => c.name);
    ok('25 张装备牌均可正常装备（kind=equip）', badKind.length === 0, badKind.join('、'));
    ok('装备牌都能读到栏位 slot', deck.filter(c => c.type === 'equip').every(c => !!c.slot));

    /* ---------- 2. 装备元数据 ---------- */
    const weapons = ['点名册','激光笔','教鞭','试卷','红笔','戒尺','粉笔','黑板擦','监控摄像头','红头文件','电风扇'];
    const expectedRange = { '点名册':1,'激光笔':2,'教鞭':2,'试卷':2,'红笔':3,'戒尺':3,'粉笔':3,'黑板擦':4,'监控摄像头':5,'红头文件':2,'电风扇':4 };
    let rangeOK = true, miss = [];
    weapons.forEach(w => {
      const m = D.CARDS[w];
      if (!m || m.slot !== 'weapon' || m.range !== expectedRange[w]){ rangeOK = false; miss.push(w); }
    });
    ok('11 把武器的栏位与攻击距离正确', rangeOK, miss.join('、'));
    const armors = ['校园卡','学生证','医保卡','雨衣'];
    ok('4 件防具均为 armor 栏位', armors.every(a => D.CARDS[a] && D.CARDS[a].slot === 'armor'));
    const m1 = ['电动车','平衡车','共享单车','滑板'], m2 = ['电摩','地铁','校车'];
    ok('4 匹 +1 坐骑（slot = mountUp）',
       m1.every(x => D.CARDS[x].slot === 'mountUp' && D.CARDS[x].mount === '+1'));
    ok('3 匹 -1 坐骑（slot = mountDown）',
       m2.every(x => D.CARDS[x].slot === 'mountDown' && D.CARDS[x].mount === '-1'));
    ok('+1 与 -1 坐骑占用**不同**栏位（互不顶替）',
       m1.every(x => D.CARDS[x].slot !== D.CARDS[m2[0]].slot));
    ok('装备栏位一共 4 个：武器 / 防具 / +1 坐骑 / -1 坐骑',
       D.EQUIP_SLOTS.length === 4 && D.EQUIP_SLOTS.indexOf('mountUp') >= 0 &&
       D.EQUIP_SLOTS.indexOf('mountDown') >= 0,
       D.EQUIP_SLOTS.join(','));

    /* ---------- 3. 当前对局：角色不重复 ---------- */
    const livePlayers = (G.players || []).filter(p => p.char);
    if (livePlayers.length){
      const ids = livePlayers.map(p => p.char.id);
      ok('当前对局角色不重复（' + livePlayers.length + ' 人）',
         new Set(ids).size === ids.length, ids.join('、'));
    }
    ok('角色库 id 唯一（20 个）',
       new Set(D.CHARACTERS.map(c => c.id)).size === D.CHARACTERS.length);

    /* ---------- 4. 数据完整性 ---------- */
    const missing = Object.keys(D.CARDS).filter(n => !D.CARD_DETAIL[n]);
    ok('每张牌都有长按详情数据', missing.length === 0, missing.join('、'));
    const noKind = Object.keys(D.CARDS).filter(n => !D.CARDS[n].kind);
    ok('所有牌名都有 kind 字段（效果分派依据）', noKind.length === 0, noKind.join('、'));

    /* ---------- 4. 距离与坐骑 ---------- */
    G.turnSeat = 0;
    G.players = [fakePlayer(0), fakePlayer(1), fakePlayer(2), fakePlayer(3)];
    ok('基础距离（隔 1 人）= 2', E.distance(G.players[0], G.players[2]) === 2,
       '实际 ' + E.distance(G.players[0], G.players[2]));
    G.players = [fakePlayer(0), fakePlayer(1), fakePlayer(2, { mount:'电动车' }), fakePlayer(3)];
    ok('目标有 +1 坐骑 → 距离 3', E.distance(G.players[0], G.players[2]) === 3,
       '实际 ' + E.distance(G.players[0], G.players[2]));
    G.players = [fakePlayer(0, { mount:'电摩' }), fakePlayer(1), fakePlayer(2), fakePlayer(3)];
    ok('自己骑 -1 坐骑 → 距离 1', E.distance(G.players[0], G.players[2]) === 1,

    ok('雨衣：普通上课点名无效', !!E.isImmuneByCard(G.players[1], blackPoint, G.players[0]));

    ok('试卷：上课点名无视雨衣', !E.isImmuneByCard(G.players[1], blackPoint, G.players[0]));

    // 点名类统一后，试卷对火/雷同样无视防具
    G.players = [fakePlayer(0, { weapon:'试卷' }), fakePlayer(1, { armor:'学生证' }), fakePlayer(2), fakePlayer(3)];
    ok('试卷：黑色雷同警告也无视学生证（点名类统一）',

    G.players = [fakePlayer(0, { weapon:'试卷' }), fakePlayer(1, { armor:'学生证' }), fakePlayer(2), fakePlayer(3)];
    ok('试卷：上课点名无视学生证', !E.isImmuneByCard(G.players[1], blackPoint, G.players[0]));

       E.canUseAttack(G.players[0], { name:'雷同警告' }) === true);
    G.players = [fakePlayer(0, { used:1 }), fakePlayer(1), fakePlayer(2), fakePlayer(3)];

    G.players = [fakePlayer(0, { weapon:'点名册', pointBan:true }), fakePlayer(1), fakePlayer(2), fakePlayer(3)];
    ok('点名册：周志远【吹牛】失败后仍被禁点名',

/* =========================================================
 *  东秦杀：点名册  ·  联机层

 *  引擎绝不在服务器上跑。
 *
 *  这个文件分六段：
 *    1. codec    —— 跨网络的对象引用编解码（卡牌按 uid、玩家按 seat）
 *    2. project  —— 主机侧：把权威状态投影成"某个接收者能看的样子"
 *    3. wire     —— 表现层事件的录制与回放
 *    4. transport—— 长轮询客户端

 *    6. client   —— 瘦客户端接线
 * ========================================================= */
(function(){

const D = window.GameData;
const E = window.Engine;

const Net = {};
window.Net = Net;

/* 武将按 id 建索引：帧里只传 charId，客户端自己解析成 D.CHARACTERS 里的对象 */
const CHAR_BY_ID = {};
D.CHARACTERS.forEach(c => { CHAR_BY_ID[c.id] = c; });
Net.CHAR_BY_ID = CHAR_BY_ID;

/* =========================================================
 *  1. codec —— 跨网络的对象引用
 * =========================================================
 *
 *  引擎靠**对象同一性**校验出牌是否合法（engine.js:1629 的 p.hand.includes(card)、
 *  engine.js:144 的 p.hand.indexOf(c)）。所以卡牌不能简单地复制过去，
 *  必须能在主机侧对回**原来那个对象**。
 *
 *  牌堆里的每张牌都有全局唯一且稳定的 uid（data.js:146 的单调计数器，
 *  牌堆重洗不会重新 buildDeck），所以卡牌用 {__card: uid} 引用。
 *
 *  但引擎里有**临时构造的牌**（engine.js:473/488 的 {name:'代课', suit:null}、
 *  engine.js:1247、engine.js:484），它们没有 uid，必须能内联传输。
 */

/** 牌堆里真实的牌：有 uid */
function isCardObj(o){
  return o && typeof o === 'object' && !Array.isArray(o)
    && typeof o.name === 'string' && typeof o.uid === 'number'
    && 'suit' in o && 'rank' in o;
}

/** 临时构造的牌（代课/上课点名/校园卡 这类只拿来显示或当虚拟牌用的） */
function isTempCardObj(o){
  return o && typeof o === 'object' && !Array.isArray(o)
    && typeof o.name === 'string' && !('uid' in o)
    && ('suit' in o || o.virtual === true);
}

function isPlayerObj(o){
  return o && typeof o === 'object' && !Array.isArray(o)
    && typeof o.seat === 'number' && 'hp' in o && 'hand' in o && 'identity' in o;
}

const CARD_FIELDS = ['name', 'suit', 'rank', 'uid', 'type', 'kind', 'dmg',
                     'slot', 'range', 'tag', 'need', 'virtual'];

/** 把一张牌摊平成纯数据（够客户端渲染 + 参与本地计算即可） */
function inlineCard(c){
  if (!c) return null;

  for (const k of CARD_FIELDS) if (c[k] !== undefined) o[k] = c[k];

}

const MAX_DEPTH = 16;   // 防循环引用；req 都是浅结构，16 层绰绰有余

 * 打包：把活对象换成可传输的引用。

 */
function pack(v, depth){

  if (isCardObj(v)){
    // 保险：凡是被打包过的牌都登记进 uid 索引（先到先得，不覆盖已有的）。
    // 主机万一忘了在 finalizeGame 之后调 indexDeck()，这里能兜住 ——
    // 否则 uid 解析不到就会退化成内联副本，而引擎靠对象同一性校验
    // （p.hand.includes(card)），会静默产生"同一张牌有两个对象"的怪状态。
    if (v.uid > 0 && !uidIndex.has(v.uid)) uidIndex.set(v.uid, v);
    return { __card: v.uid, c: inlineCard(v) };
  }
  if (isTempCardObj(v)) return { __vc: inlineCard(v) };
  const out = {};
  for (const k in v){
    if (!Object.prototype.hasOwnProperty.call(v, k)) continue;
    const pv = pack(v[k], depth + 1);
    if (pv !== undefined) out[k] = pv;
  }
  return out;
}
Net.pack = pack;

/**
 * 拆包：把引用还原成活对象。
 *  - 玩家：按 seat 从 G.players 里取
 *  - 卡牌：先查 uid 索引；查不到就用内联副本兜底（比如【小组作业】亮出的
 *          是别人手里的牌，接收方的快照里根本没有这张牌）
 */
function unpack(v, depth){
  if (v === null || v === undefined) return v;
  if (typeof v !== 'object') return v;
  if (depth > MAX_DEPTH) return null;
  if (Array.isArray(v)) return v.map(x => unpack(x, depth + 1));
  if ('__seat' in v){
    const p = (window.G && G.players) ? G.players[v.__seat] : null;
    return p || null;
  }
  if ('__card' in v) return Net.resolveCard(v.__card, v.c);
  if ('__vc' in v) return Object.assign({}, v.__vc);
  const out = {};
  for (const k in v){
    if (Object.prototype.hasOwnProperty.call(v, k)) out[k] = unpack(v[k], depth + 1);
  }
  return out;
}
Net.unpack = unpack;

/* ---- uid → 卡牌原对象 的索引 ---- */

const uidIndex = new Map();
Net.uidIndex = uidIndex;

/** 主机侧：finalizeGame 之后调用一次，把整副牌都登记进来。
 *  牌堆重洗只是重新排列同一批对象（engine.js:83），uid 不会变，所以登记一次就够。 */
Net.indexDeck = function(){
  if (!window.G || !G.deck) return 0;
  let n = 0;
  for (const c of G.deck) if (c && typeof c.uid === 'number'){ uidIndex.set(c.uid, c); n++; }
  return n;
};

/** 客户端侧：从快照里把自己的手牌和所有公开牌登记进来 */
Net.indexFromSnapshot = function(snap){
  const add = c => { if (c && typeof c.uid === 'number' && c.uid > 0) uidIndex.set(c.uid, c); };
  (snap.players || []).forEach(p => {
    (p.hand || []).forEach(add);
    (p.judge || []).forEach(add);
    D.EQUIP_SLOTS.forEach(k => add(p.equips && p.equips[k]));
  });
};

/** 把当前局面上**所有**的牌都登记进来（接手存档之后必须做一次：
    这时候牌堆已经发出去一部分，光索引 G.deck 会漏掉已经在手里的牌） */
Net.indexAll = function(){
  const G = window.G;
  if (!G) return 0;
  const add = c => { if (c && typeof c.uid === 'number' && c.uid > 0) uidIndex.set(c.uid, c); };
  (G.deck || []).forEach(add);
  (G.discard || []).forEach(add);
  (G.players || []).forEach(p => {
    (p.hand || []).forEach(add);
    (p.judge || []).forEach(add);
    D.EQUIP_SLOTS.forEach(k => add(p.equips && p.equips[k]));
  });
  return uidIndex.size;
};

/** 查 uid 索引；查不到就用内联副本造一个（并登记，保证同一 uid 始终映射同一对象） */
Net.resolveCard = function(uid, inline){
  if (typeof uid === 'number' && uidIndex.has(uid)) return uidIndex.get(uid);
  const c = inline ? Object.assign({}, inline) : { name:'？', suit:'S', rank:1, uid:uid };
  if (typeof uid === 'number') uidIndex.set(uid, c);
  return c;
};

/* =========================================================
 *  2. project —— 主机侧的状态投影
 * ========================================================= */

/*  !!! 不能优化掉的取巧  !!!
 *
 *  别人的手牌用**等长的占位牌数组**，而不是"空数组 + 一个 handCount 字段"。
 *
 *  原因：客户端的 E.validTargets 判断【通报批评/抄作业/当面约谈】能不能指向某人时，

 *
 *  ui.js / fx.js 读对手手牌**只读 .length**（ui.js:152/403/459、fx.js:469），
 *  所以等长占位牌在渲染上和真牌完全等价。别动它。

function placeholderCard(){
  return { name:'？', suit:'S', rank:1, uid:-1, type:'basic', kind:'none',
           dmg:'normal', slot:null, range:0, tag:null, need:null, hidden:true };
}

/** 打给外部的状态标记白名单 —— 顺便把内部字段（slideTurn 除外）挡在外面 */
function projectMarks(p){
  const m = p.marks || {};
  const out = {};
  if (m.buff) out.buff = m.buff;
  if (m.pigeon) out.pigeon = m.pigeon;
  if (m.net) out.net = m.net;

  if (m.slideTurn !== undefined) out.slideTurn = m.slideTurn;
  if (m.slideFrom !== undefined) out.slideFrom = m.slideFrom;
  return out;

  const self = (p.seat === viewerSeat);
  const known = self || revealAll || p.revealed || p.identity === 'dean';
  return {
    seat: p.seat,
    name: p.char ? p.char.name : ('座位 ' + (p.seat + 1)),   // 引擎里 name 是 getter，必须显式带上
    charId: p.char ? p.char.id : null,
    identity: known ? p.identity : null,
    revealed: !!p.revealed,
    hp: p.hp,
    maxHp: p.maxHp,
    alive: !!p.alive,
    isHuman: !!p.isHuman,
    ai: !!p.auto,                     // 掉线托管中
    hand: self ? p.hand.map(inlineCard) : p.hand.map(placeholderCard),
    equips: {
      weapon:    inlineCard(p.equips.weapon),
      armor:     inlineCard(p.equips.armor),
      mountUp:   inlineCard(p.equips.mountUp),
      mountDown: inlineCard(p.equips.mountDown)
    },
    judge: p.judge.map(inlineCard),
    chained: !!p.chained,

    dodgeBan: !!p.dodgeBan,
    pointBan: !!p.pointBan

/**
 * 投影一份发给某人的状态。
 *   viewerSeat >= 0 —— 该玩家的座位
 *   viewerSeat < 0  —— 旁观者（看得到一切公开信息，看不到任何手牌和身份）
 *   revealAll       —— 终局时所有身份公开（UI.showOver 会读所有人的 identity）
 */
Net.project = function(viewerSeat, revealAll){
  const G = window.G;
  if (!G || !G.players) return null;
  const LOG_TAIL = 200;
  const logAll = G.log || [];
  const logStart = Math.max(0, logAll.length - LOG_TAIL);
  const log = [];
  for (let i = logStart; i < logAll.length; i++){
    const e = logAll[i];
    // 带 only 的日志条目（【窃听】【侃山】会打印别人的手牌）按座位脱敏
    if (e.only && !revealAll && viewerSeat >= 0 && e.only.indexOf(viewerSeat) >= 0){
      log.push({ text: e.text, cls: e.cls });
    } else if (e.only){
      log.push({ text: e.redacted || e.text, cls: e.cls });
    } else {
      log.push({ text: e.text, cls: e.cls });
    }

    rev: Net.rev,

    // 从快照里抄的话会让每个客户端都去渲染房主的手牌和身份。
    players: G.players.map(p => projectPlayer(p, viewerSeat, revealAll)),
    turnSeat: G.turnSeat,
    round: G.round,
    turnId: G.turnId,                 // 客户端算划水限制要用
    over: !!G.over,
    speed: G.speed,
    deckCount: G.deck ? G.deck.length : 0,
    discardCount: G.discard ? G.discard.length : 0,
    logStart: logStart,
    log: log,

    // 否则轮到别人时玩家分不清对方是在想、还是掉线了。
    asking: (Net.askingSeat >= 0)
      ? { seat: Net.askingSeat, until: Net.askUntil || 0 }
      : null
  };

 * =========================================================
 *
 *  主机把引擎对 FX.* / UI.setPhase 的调用录成事件发给客户端，客户端喂给
 *  本地**真的** FX.* —— 音效、飘字、出牌区、查考勤翻牌全都还在，
 *  而且各端按自己的 G.speed 播放。
 */

/** 要录制的 FX 方法。异步的那几个必须录，否则客户端会丢掉整段演出。 */
const FX_NAMES = [
  'sfx', 'floatText', 'shake', 'flash', 'thinking', 'skillBanner',
  'beginExchange', 'addToExchange', 'cardPlay', 'endExchange',
  'turnBanner', 'judge', 'death', 'gameEnd'
];

 * 包装一个 FX 方法：本机照常执行，同时把调用录成事件。
 *
 * ！！重入抑制是必须的！！ —— fx.js 内部自己也在调 FX.*：
 *   FX.cardPlay      → FX.addToExchange (fx.js:207)  → FX.sfx (fx.js:201)
 *   FX.judge         → FX.sfx           (fx.js:321)
 *   FX.death         → FX.sfx / FX.flash (fx.js:337-338)
 * 不抑制的话，引擎调一次 cardPlay 会录到「cardPlay」和它内部的「addToExchange」
 * 两条，客户端出牌区会插两张、音效放两遍。
 *
 * 抑制窗口只覆盖**同步执行的那一段**（用 finally 立刻归零，不等 promise）。
 * 这是有意的，而且和 fx.js 的写法精确吻合：上面那些嵌套调用全部发生在
 * 各自的第一个 await 之前（fx.js:207 在 208 之前、321 在 330 之前、
 * 337-338 在 347 之前）。
 *
 * 反例警告：如果改成"等 promise 结束才归零"的全局计数器，那么当一个异步 FX
 * （比如 turnBanner 要 720ms）还没播完时，引擎又发起了下一个 FX 调用，那一条
 * 就会被**静默吃掉**。引擎目前是逐条 await 的所以看不出来，但那是运气，不是保证。
 */
function wrapFx(name){
  const FX = window.FX;
  if (!FX || typeof FX[name] !== 'function' || FX[name].__wrapped) return;
  const orig = FX[name];
  function wrapped(){
    const args = Array.prototype.slice.call(arguments);
    const outer = (wireDepth === 0);
    if (outer && Net.recording){
      const packed = [];
      for (const a of args){
        const p = pack(a, 0);
        packed.push(p === undefined ? null : p);
      }
      Net.events.push({ k: name, a: packed });
    }
    wireDepth++;
    try {
      return orig.apply(FX, args);
    } finally {
      wireDepth--;
    }

  FX[name] = wrapped;

/** 主机侧：开始把表现层调用录成事件 */
Net.startRecording = function(){
  Net.recording = true;
  FX_NAMES.forEach(wrapFx);

  const UI = window.UI;
  if (UI && !UI.setPhase.__wrapped){
    const orig = UI.setPhase;
    const w = function(name){
      if (Net.recording) Net.events.push({ k: 'phase', a: [name] });
      return orig.apply(UI, arguments);
    };
    w.__wrapped = true;
    UI.setPhase = w;
  }

  // 单机的复盘录制也靠它决定什么时候存一帧状态。
  if (UI && !UI.render.__dirtyWrapped){
    const origRender = UI.render;
    const rw = function(){ Net.dirty = true; return origRender.apply(UI, arguments); };
    rw.__dirtyWrapped = true;
    UI.render = rw;
  }
};

Net.stopRecording = function(){
  Net.recording = false;
  Net.events.length = 0;
};

/** 主机侧：把累积的事件取出来并清空 */
Net.takeEvents = function(){
  if (!Net.events.length) return null;
  const e = Net.events;
  Net.events = [];
  return e;
};

/* ---- 客户端侧：事件回放 ---- */

const replayQueue = [];
let replaying = false;

const REPLAY_FN = {
  sfx:          (FX, a) => FX.sfx(a[0]),
  floatText:    (FX, a) => FX.floatText(a[0], a[1], a[2]),
  shake:        (FX, a) => FX.shake(a[0], a[1]),
  flash:        (FX, a) => FX.flash(a[0]),
  thinking:     (FX, a) => FX.thinking(a[0], a[1]),
  skillBanner:  (FX, a) => FX.skillBanner(a[0], a[1]),
  beginExchange:(FX) => FX.beginExchange(),
  addToExchange:(FX, a) => FX.addToExchange(a[0], a[1], a[2], a[3]),
  cardPlay:     (FX, a) => FX.cardPlay(a[0], a[1], a[2], a[3]),
  endExchange:  (FX) => FX.endExchange(),
  turnBanner:   (FX, a) => FX.turnBanner(a[0]),
  judge:        (FX, a) => FX.judge(a[0], a[1]),
  death:        (FX, a) => FX.death(a[0]),
  gameEnd:      (FX, a) => FX.gameEnd(a[0])
};

Net.enqueueEvents = function(list){
  if (!list || !list.length) return;
  for (const ev of list) replayQueue.push(ev);
  if (!replaying) pumpReplay();
};

function pumpReplay(){
  replaying = true;
  const step = () => {
    if (!replayQueue.length){ replaying = false; return; }
    const backlogged = replayQueue.length > REPLAY_BACKLOG;
    const ev = replayQueue.shift();
    let r = null;
    try {
      if (ev.k === 'phase'){
        window.UI.setPhase(ev.a[0]);
      } else {
        const fn = REPLAY_FN[ev.k];
        if (fn) r = fn(window.FX, (ev.a || []).map(x => unpack(x, 0)));
      }
    } catch (e){
      // 单条演出失败不能拖垮整个回放
      r = null;
    }
    if (r && typeof r.then === 'function' && !backlogged){
      r.then(step, step);
    } else {
      step();       // 积压时不等动画，直接往下走
    }
  };
  step();
}

Net.replayPending = function(){ return replayQueue.length; };

/* =========================================================
 *  4. transport —— 长轮询客户端
 * ========================================================= */

function delay(ms){
  return new Promise(r => setTimeout(r, ms));
}
Net.delay = delay;

/** 服务器地址：从 http(s) 打开时用同源地址（零配置）；否则用存下来的地址 */
Net.serverBase = function(){
  if (location.protocol === 'http:' || location.protocol === 'https:') return location.origin;
  try { return localStorage.getItem('dqk_net_server') || ''; } catch (e){ return ''; }
};

Net.setServerBase = function(url){
  try { localStorage.setItem('dqk_net_server', url || ''); } catch (e){ /* 忽略 */ }
};

function Transport(baseUrl, code, peer, token, handlers){
  this.base = String(baseUrl).replace(/\/+$/, '');
  this.code = code;
  this.peer = peer;
  this.token = token;
  this.seq = 0;
  this.handlers = handlers || {};
  this.running = false;
  this.online = false;
}

Transport.prototype.post = function(path, body, timeoutMs){
  const ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), timeoutMs || 45000) : null;
  const init = {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    cache: 'no-store'
  };
  if (ctl) init.signal = ctl.signal;
  return fetch(this.base + path, init).then(
    r => r.json().then(j => { if (timer) clearTimeout(timer); return j; }),
    e => { if (timer) clearTimeout(timer); throw e; }
  );
};

Transport.prototype.start = function(){
  if (this.running) return;
  this.running = true;
  this.loop();
};

Transport.prototype.stop = function(){
  this.running = false;
};

Transport.prototype.setOnline = function(v){
  if (this.online === v) return;
  this.online = v;
  const h = this.handlers;
  if (v && h.onUp) h.onUp();
  if (!v && h.onDown) h.onDown();
};

/**
 * 长轮询主循环。
 *
 * 注意：**绝不用 setTimeout 串起来**。浏览器会把后台标签页的定时器节流到
 * 几十秒甚至一分钟一次，那样玩家切走再回来游戏就卡死了。这里靠服务端
 * 25 秒超时返回空响应来自然驱动节奏，客户端拿到响应立刻发下一次请求 ——
 * 整个循环里没有任何定时器，后台标签页也不会变慢。
 */
Transport.prototype.loop = async function(){
  while (this.running){
    let res = null;
    try {
      res = await this.post('/api/poll', {
        code: this.code, peer: this.peer, token: this.token, since: this.seq
      }, 40000);
    } catch (e){
      if (!this.running) break;
      this.setOnline(false);
      await delay(1500);
      continue;
    }
    if (!this.running) break;
    if (!res || !res.ok){
      this.setOnline(false);
      if (this.handlers.onFatal && res && res.err) this.handlers.onFatal(res.err);
      await delay(2500);
      continue;
    }
    this.setOnline(true);
    if (typeof res.seq === 'number') this.seq = res.seq;
    if (res.resync && this.handlers.onResync) this.handlers.onResync();
    const msgs = res.msgs || [];
    for (const m of msgs){
      try { if (this.handlers.onMessage) this.handlers.onMessage(m); }
      catch (e){ /* 单条消息出错不能中断轮询 */ }
    }
  }
};

Transport.prototype.send = function(to, data){
  return this.post('/api/send', {
    code: this.code, peer: this.peer, token: this.token, to: to, data: data
  }, 15000).catch(() => null);
};

/** 加入/创建房间。成功返回 {code, peer, token, host}，失败抛错。 */
Net.connect = function(baseUrl, path, body){
  const base = String(baseUrl).replace(/\/+$/, '');
  return fetch(base + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    cache: 'no-store'
  }).then(r => r.json()).then(j => {
    if (!j || !j.ok) throw new Error((j && j.err) || '服务器没有响应');
    return j;
  }, e => {
    throw new Error('连不上服务器（' + base + '）：' + (e && e.message ? e.message : e));
  });
};

Net.Transport = Transport;

/* =========================================================
 *  5. session —— 主机与客户端共用的会话状态
 * ========================================================= */

Net.rev = 0;
Net.session = null;        // {base, code, peer, token, name, isHost}
Net.roster = [];           // [{peer, name, spectator, seat, online, self}]
Net.mySeat = -1;           // 客户端自己坐哪（旁观 = -1）
Net.config = { count: 5, deal: 3, mode: 'A', protect: true, hostPlays: true, aiLevel: 'normal' };
Net.lastResult = null;

Net.isOnline = function(){ return !!(Net.session && Net.transport && Net.transport.running); };

Net.setSpeed = function(v){
  if (!Net.session) return;
  if (Net.session.isHost){
    if (window.G) G.speed = v;
    Net.speed = v;
  } else {
    Net.transport.send('host', { t: 'speed', v: v });
  }
};

function esc(s){
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function sendTo(peer, data){
  if (!Net.transport) return;
  Net.transport.send(peer, data);
}

/** 广播给房间里所有人（to='all' 不会回声给发送者，所以本机要自己渲染） */
function broadcast(data){
  if (Net.transport) Net.transport.send('all', data);
}

/* =========================================================
 *  6. lobby —— 建房 / 加入 / 房间等待
 * ========================================================= */

function netBox(){ return document.getElementById('net-box'); }

function renderLobby(html){

function serverHint(){

function serverRow(){

/** 首页：创建房间 / 加入房间 */
